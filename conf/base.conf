/*
================================================================================
 yascp — base configuration
================================================================================
 HOW TO READ THIS FILE
--------------------------------------------------------------------------------
 Every parameter is written as a block with a description and a value:

     my_param {
         description = """What this does, and what it interacts with."""
         value       = 'the actual setting you change'
     }

 Some grouped parameters (cellsnp, vireo, genotype_input, ...) keep several
 named fields inside one block; there the description documents each field in
 turn and the fields themselves are plain `name = value` lines.

 Marker conventions used in the descriptions:

     REQUIRES / REQUIRED   must be set (or set consistently with another
                           parameter) for the feature to take effect
     NOTE                  worth reading before changing the value
     OPTIONS               the accepted values for this parameter

--------------------------------------------------------------------------------
 CONTENTS
--------------------------------------------------------------------------------
   0) GLOBAL / ORCHESTRATION
        Inputs, labels, output locations, run-mode switches, GPU
   1) PREPROCESSING
        CellBender / CellRanger ambient RNA removal, CITE-seq split
   2) DOUBLET DETECTION & CELL TYPE ASSIGNMENT
        scrublet & friends, Azimuth / scPred / CellTypist / keras
   3) DECONVOLUTION
        Genotype-based donor demultiplexing (cellSNP / vireo), GT matching
   4) CLUSTERING & INTEGRATION
        QC filters, normalisation, Harmony / BBKNN / TotalVI, clustering, UMAP
================================================================================
*/

params {

//==============================================================================
// 0) GLOBAL / ORCHESTRATION
//==============================================================================

    //--------------------------------------------------------------------------
    // 0.1 Input files — set input_data_table OR file__anndata_merged
    //--------------------------------------------------------------------------

    input_data_table {
        description = """Path to the main input TSV: experiment_id, n_pooled, donor_vcf_ids,
            data_path_10x_format (+ optional donor/hastag columns).
            REQUIRED for a normal run (subworkflows/prepare_inputs.nf).
            Ignored if skip_preprocessing.value = true."""
        value       = ''
    }

    input_tables_column_delimiter {
        description = """Column delimiter used in input_data_table (and other
            pipeline-generated sample tables)."""
        value       = '\t'
    }

    file__anndata_merged {
        description = """Path to a pre-merged AnnData (.h5ad) file.
            REQUIRED WHEN skip_preprocessing.value = true, or when using the JUST_CELLTYPES /
            JUST_DOUBLETS / JUST_RECLUSTER entry points in main.nf - it stands in for the file
            that MERGE_SAMPLES would otherwise produce."""
        value       = ''
    }

    atac {
        description = """Is this an ATAC dataset?
            Cross-cutting flag consumed in preprocessing, doublet detection (scDblFinder)
            and celltype assignment (Azimuth)."""
        value       = false
    }

    //--------------------------------------------------------------------------
    // 0.2 Labels used throughout the pipeline
    //--------------------------------------------------------------------------

    RUN {
        description = """Run/tranche name embedded into report and concordance filenames.
            Cosmetic label only."""
        value       = 'default'
    }

    id_in {
        description = """Name of the column identifying each sample/pool.
            Must match metadata_key_column.value (section 4) and the 'experiment_id' column
            used throughout input_data_table."""
        value       = 'experiment_id'
    }

    project_name {
        description = """Project/cohort name embedded in summary reports."""
        value       = 'default'
    }

    //--------------------------------------------------------------------------
    // 0.3 Output, working and trace locations; publish mode; web transfer
    //--------------------------------------------------------------------------

    tmpdir {
        description = """Nextflow work directory.
            REQUIRED WHEN remove_work_dir.value = true - this is exactly the directory
            that gets deleted on successful completion."""
        value       = "${launchDir}/work"
    }

    outdir {
        description = """Default output directory."""
        value       = "${launchDir}/results"
    }

    // NOTE: tracedir must stay defined AFTER outdir. params.outdir.value resolves against
    // what has been defined so far, so if tracedir comes first it evaluates to an empty
    // map and the trace files land in a directory literally named '[:]'.
    tracedir {
        description = """Default directory for trace files."""
        value       = "${params.outdir.value}/pipeline_info"
    }

    copy_mode {
        description = """Default publishDir copy mode.
            OPTIONS: copy | link | rellink | symlink
            Switch to "copy" if you intend to delete the work directory
            (remove_work_dir.value = true) while keeping ${outdir.value}."""
        value       = "rellink"
    }

    webtransfer {
        description = """Gates the TRANSFER process that rsyncs summary stats to a dedicated
            visualisation server.
            NOTE: Sanger-specific - leave false unless you have access to that server."""
        value       = false
    }

    rsync_to_web_file {
        description = """Script invoked by the TRANSFER process above.
            REQUIRED WHEN webtransfer.value = true. Sanger-specific."""
        value       = "${launchDir}/yascp/bin/rsync_to_web.sh"
    }

    //--------------------------------------------------------------------------
    // 0.4 Run-mode switches
    //--------------------------------------------------------------------------

    remove_work_dir {
        description = """If true, deletes ${tmpdir.value} once the pipeline completes
            successfully.
            NOTE: irreversible - only enable once you are sure you will not need to
            resume/debug from the work directory."""
        value       = false
    }

    skip_handover {
        description = """Skip the DATA_HANDOVER subworkflow (summary stats generation,
            web transfer, per-donor bam split).
            NOTE: DATA_HANDOVER still runs whenever skip_qc.value = false, regardless
            of this flag."""
        value       = false
    }

    just_reports {
        description = """If true, skip preprocessing / doublet detection / celltype assignment /
            deconvolution / QC entirely, and only rebuild the artificial bam-split channel
            plus the final reports from an already-populated ${outdir.value}."""
        value       = false
    }

    skip_preprocessing {
        description = """If true, skip CellBender/CellRanger, doublet detection, celltype
            assignment and deconvolution, and start straight from a pre-merged AnnData given
            in file__anndata_merged.
            REQUIRED WHEN true: file__anndata_merged must point to a valid .h5ad, and (if you
            want GT-match results carried over) gt_match_file should also be set."""
        value       = false
    }

    //--------------------------------------------------------------------------
    // 0.5 Hardware
    //--------------------------------------------------------------------------

    utilise_gpu {
        description = """Use a GPU for processes that support it (CellBender, TotalVI).
            REQUIRED for CellBender, and can affect TotalVI.
              - CellBender options are in section 1 below.
              - TotalVI options are in section 4 below.
            NOTE: requires an executor/profile that can actually schedule GPU jobs;
            otherwise those processes will fail to be scheduled."""
        value       = true
    }


//==============================================================================
// 1) PREPROCESSING
//==============================================================================

    input {
        description = """Which counts to carry forward as the "filtered" matrix.
            OPTIONS:
              cellbender   run ambient-RNA removal
              cellranger   use CellRanger-filtered counts as-is, skipping CellBender entirely"""
        value       = 'cellranger'
    }

    citeseq_config {
        description = """Regex/label list (',' or ' ' separated) identifying hashtag /
            antibody-capture features to split out of the GEX matrix before CellBender.
            NOTE: always applied, regardless of whether your data is actually multiplexed."""
        hastag_multiplexing_capture_labels = '"Hastag_.*,Another_Label"'
    }

    //--------------------------------------------------------------------------
    // 1.1 CellBender — only used when input.value = 'cellbender'
    //--------------------------------------------------------------------------

    cellbender_with_citeseq {
        description = """If true, CellBender is run on the raw (unsplit) matrix including
            CITE-seq/antibody-capture features instead of GEX-only counts - i.e. CITE-seq and
            other modalities are NOT stripped out beforehand.
            NOTE: only supported from CellBender 0.3.1 onward.
            NOTE: runs much faster with utilise_gpu.value = true; on CPU alone CellBender is
            slow (strongly recommended, not a hard requirement)."""
        value       = false
    }

    // If you have already processed any of the samples below with yascp, point at the
    // existing results directory and the pipeline will reuse them instead of
    // reprocessing from scratch.

    cellbender_location {
        description = """Only samples NOT found here are (re)run through CellBender.
            CellBender is slow and resource-heavy, so this avoids redundant recompute
            across pipeline re-runs."""
        value       = "${launchDir}/results"
    }

    cellbender_ignore_list {
        description = """List of experiment_id values to skip from CellBender processing
            entirely (e.g. a sample so bad it causes repeated failures/retries)."""
        value       = ['random_value_1234']
    }

    cellbender_v {
        description = """Which CellBender version's CLI/behaviour to target.
            OPTIONS: '0.2.0' (default code path) | '0.3.1' | '0.3.2'
            REQUIRED: must match the CellBender version baked into the container you run."""
        value       = '0.2.0'
    }

    cellbender_resolution_to_use {
        description = """Which FPR (false-positive-rate) resolution's output to use downstream,
            out of the values swept in cellbender_rb.fpr.value below.
            Default sweep is 0.01 / 0.05 / 0.1, encoded as '0pt01' / '0pt05' / '0pt1'.
            REQUIRED to match one of the values actually produced by cellbender_rb.fpr.value,
            or downstream steps (celltype prediction, gather_data, summary stats) will not
            find the expected files."""
        value       = '0pt1'
    }

    cellbender_rb {
        description = """Parameters for CellBender remove-background.

            Parameters can be supplied in two ways:
              - global defaults (the blocks below), applied to all samples;
              - per-sample overrides in the `per_sample_thresholds` block, keyed by the
                `experiment_id` in input.tsv. These override ALL global parameters.

            NOTE: support for setting `expected_cells` and `total_droplets_included` via the
            file_paths_10x.tsv columns (`ncells_expected`, `ndroplets_include_cellbender`)
            has been removed. Provide these exclusively through this config."""

        per_sample_thresholds {
            description = """Per-sample overrides - `name` must match the experiment_id in
                input.tsv. Any field omitted here falls back to the matching
                estimate_params_umis / epochs / learning_rate / zdim / zlayers /
                low_count_threshold value below (modules/local/cellbender/main.nf)."""
            value       = [
                [ name : 'H15672658', low_count_threshold : 5, epochs : 100, learning_rate : 0.0001, zdim : 100, zlayers : 500, total_droplets_included: 15000, expected_cells: 70 ],
            ]
        }

        estimate_params_umis {
            description = """CellBender requires two key parameters:
                  (1) expected_cells            number of real cells expected in the dataset
                  (2) total_droplets_included   total droplets to include in the model (both
                                                cell-containing and empty), typically based on
                                                a UMI count threshold

                These can be either estimated automatically using
                `get_estimates_from_umi_counts.py` (default), or overridden per sample via
                `per_sample_thresholds` above.

                Reading the UMI plot:
                  expected_cells            from the left part of the UMI curve, where droplets
                                            are believed to contain real cells
                  total_droplets_included   from the point on the UMI curve beyond which
                                            droplets are assumed to be empty

                Estimating the number of cells:
                  method_estimate_ncells                 method used to detect the knee or
                                                         inflection point
                  lower_bound_umis_estimate_ncells       ignore droplets below this UMI count

                Estimating the number of empty droplets:
                  method_estimate_nemptydroplets         method used to estimate the cutoff
                                                         (as above, plus a weight parameter)
                  lower_bound_umis_estimate_nemptydroplets   ignore droplets below this threshold
                  upper_bound_umis_estimate_nemptydroplets   ignore droplets above this threshold
                  estimate_nemptydroplets_umi_add_factor     shift the cutoff by this UMI value
                  expected_nemptydroplets_umi_cutoff         override the estimate with a fixed
                                                             UMI value
                  estimate_nemptydroplets_min_drop           minimum cutoff, if the estimate is
                                                             too low
                  estimate_nemptydroplets_subtract_cell_factor  subtract this from the estimated
                                                             cell count to get the final cutoff

                Override behaviour: if `expected_cells` and `total_droplets_included` are given
                via `per_sample_thresholds`, no estimation is performed for that sample.

                NOTE: these parameters are dataset- and tissue-dependent. Review the UMI plots
                carefully before overriding.
                NOTE: avoid sweeping parameter iteration here - the current implementation does
                not record the exact estimation settings in the output directory."""

            value {
                expected_nemptydroplets_umi_cutoff           = 0
                method_estimate_ncells                       = 'dropletutils::barcoderanks::inflection'
                lower_bound_umis_estimate_ncells             = 1000
                method_estimate_nemptydroplets               = 'dropletutils::barcoderanks::inflection,dropletutils::barcoderanks::knee,0.33'
                lower_bound_umis_estimate_nemptydroplets     = 10
                upper_bound_umis_estimate_nemptydroplets     = 250
                estimate_nemptydroplets_umi_add_factor       = 0
                estimate_nemptydroplets_subtract_cell_factor = 0
                estimate_nemptydroplets_min_drop             = 0
            }
        }

        epochs {
            description = """Number of epochs for training.
                CellBender default is 150."""
            value       = 250
        }

        learning_rate {
            description = """Learning rate. With a lower learning rate you may need to
                increase the number of epochs.
                CellBender default is 0.0001."""
            value       = 0.000005
        }

        zdim {
            description = """Dimension of latent variable z. In v2 this parameter influences
                the prior on cell counts.
                See https://github.com/broadinstitute/CellBender/issues/42
                CellBender default is 100."""
            value       = 100
        }

        zlayers {
            description = """Dimension of hidden layers in the encoder for z.
                CellBender default is 500."""
            value       = 500
        }

        low_count_threshold {
            description = """Droplets with UMI counts below this number are completely excluded
                from the analysis. This can help identify the correct prior for empty droplet
                counts in the rare case where empty counts are extremely high (over 200).
                CellBender default is 15."""
            value       = 10
        }

        fpr {
            description = """Target false positive rate in (0, 1). A false positive is a true
                signal count that is erroneously removed; more background removal comes with
                more signal removal at high FPR values.
                A value of 0.01 is generally quite good, but you can generate several output
                count matrices and compare them by giving several values, e.g. 0.01 0.05 0.1.
                CellBender default is 0.01.
                NOTE: the value selected by cellbender_resolution_to_use (above) must be one of
                the resolutions produced by this sweep."""
            value       = "0.01 0.05 0.1"
        }
    }

    doublets_and_celltypes_on_cellbender_corrected_counts {
        description = """If true, doublet detection and celltype assignment run on the
            CellBender-corrected counts; if false, they run on the pre-CellBender
            (CellRanger-filtered) counts instead."""
        value       = true
    }

    // ---- end of input = 'cellbender' only parameters -------------------------


//==============================================================================
// 2) DOUBLET DETECTION & CELL TYPE ASSIGNMENT
//==============================================================================

    doublet_celltype_split_column {
        description = """Column in .obs used to split the merged dataset into per-batch h5ad
            files before running doublet detection and cell type assignment.
            Set to 'None' to disable splitting and process everything as one batch."""
        value       = 'None'
    }

    //--------------------------------------------------------------------------
    // 2.1 Doublet detection
    //--------------------------------------------------------------------------

    filter_multiplets {
        description = """Parameters for the doublet-detection workflow."""

        run_process {
            description = """Master switch for the whole doublet-detection workflow.
                If false, none of the sub-methods below run."""
            value       = true
        }

        doubletDetection {
            description = """Enables doubletDetection."""
            run_process = false
        }

        doubletDecon {
            description = """Enables doubletDecon."""
            run_process = true
        }

        scDblFinder {
            description = """Enables scDblFinder."""
            run_process = true
        }

        scds {
            description = """Enables scds."""
            run_process = true
        }

        doubletFinder {
            description = """Enables doubletFinder."""
            run_process = true
        }

        scrublet {
            description = """Parameters for scrublet. Runs prior to the filters below.

                  run_process                  enables/disables scrublet
                  n_simulated_multiplet        number of multiplets to simulate
                  multiplet_threshold_method   method used to call multiplets
                  scale_log10                  scale simulated doublet scores to log10 before
                                               deriving the threshold; must be 'True' or 'False'

                Output from multiplet analysis is added to the final AnnData object.
                NOTE: the flag only works if file_cellmetadata from the main nextflow call
                is not set."""
            run_process                = true
            n_simulated_multiplet      = 100000
            multiplet_threshold_method = 'threshold_li'
            scale_log10                = 'False'
        }

        expected_multiplet_rate {
            description = """Expected multiplet rate. Used for scrublet and doubletFinder."""
            value       = 0.1
        }
    }

    //--------------------------------------------------------------------------
    // 2.2 Cell type assignment
    //--------------------------------------------------------------------------

    celltype_assignment {

        run_celltype_assignment {
            description = """Master switch for the whole celltype-assignment workflow.
                If false, none of the sub-methods below run."""
            value       = true
        }

        run_azimuth {
            description = """Enables Azimuth.
                If true, specify mapping_file, remap_celltypes and azimuth.celltype_refsets
                (below)."""
            value       = true
        }

        run_scpred {
            description = """Enables scPred. If true, specify scpred.reference (below)."""
            value       = true
        }

        run_keras {
            description = """Enables keras. If true, specify celltype_prediction.keras.*
                (below)."""
            value       = false
        }

        run_celltypist {
            description = """Enables CellTypist. If true, specify celltypist.models (below)."""
            value       = true
        }
    }

    //--------------------------------------------------------------------------
    // 2.3 Azimuth — REQUIRES celltype_assignment.run_azimuth.value = true
    //--------------------------------------------------------------------------

    mapping_file {
        description = """Maps raw Azimuth reference labels to the mapping columns consumed
            by AZIMUTH."""
        value       = "${projectDir}/assets/azimuth/Azimuth_Mappings.txt"
    }

    remap_celltypes {
        description = """For PBMCs, also map the l2 annotations down to less granular
            l1/l3 labels.
            NOTE: only takes effect if mapping_file is specified and PBMC is selected in
            azimuth.celltype_refsets."""
        value       = true
    }

    azimuth {
        description = """List of Azimuth reference sets to annotate against.
            Not used if atac.value = true."""
        celltype_refsets = [
            // [ name : 'kidney', refset : "/lustre/scratch123/hgi/teams/hgi/mo11/tmp_projects/jaguar_yascp/nieks_pipeline/yascp_run/ref_kidney", annotation_labels : "cluster,subclass" ],
            [ name : 'PBMC', refset : "PBMC", annotation_labels : "celltype.l2,celltype.l1,celltype.l3" ],
        ]

        // [INERT] Commented out due to errors. celltype_atac_refsets is only referenced
        // inside a commented-out AZIMUTH_ATAC(...) call in subworkflows/celltype.nf - the
        // atac.value = true branch currently just emits a placeholder file instead. Kept
        // here so the block is ready to re-enable once AZIMUTH_ATAC is restored.
        //
        // celltype_atac_refsets = [
        //     // [ name : 'kidney', refset : "/lustre/scratch123/hgi/teams/hgi/mo11/tmp_projects/jaguar_yascp/nieks_pipeline/yascp_run/ref_kidney", annotation_labels : "cluster,subclass" ],
        //     [ name : 'PBMC', refset : "PBMC", annotation_labels : "celltype.l2,celltype.l1,celltype.l3" ],
        // ]
    }

    //--------------------------------------------------------------------------
    // 2.4 keras — REQUIRES celltype_assignment.run_keras.value = true
    //--------------------------------------------------------------------------

    celltype_prediction {
        keras {
            description = """A bespoke model from the Anderson lab for IBD research,
                used to annotate cells.
                
                keras_model                         Keras h5 model (output from scanpy_cluster_validate_resolution-keras.py).
                keras_weights_df                    Keras weights dataframe (output from scanpy_cluster_validate_resolution-keras.py).
                keras_model_cluster_labels          CSV file of cluster labels for of the clusters for the Keras model. 
                filter_top_cell_probabilities       Comma seperated list. If >0.0, then only save cells where the 
                                                    top cell type prediction probability is > than this value. 
                                                    Valid values between 0 and 1.
                save_all_probabilities              Save AnnData of cell type probabilities for each cell across all cell types.
                                                    default value '--save_all_probabilities'. to swithc off put ''
                h5_layer                            AnnData layer the keras model expects as input."""
                
            keras_model                = 'https://yascp.cog.sanger.ac.uk/public/celltype/keras/keras_606D0E926847C0A1_clustered.h5'
            keras_weights_df           = 'https://yascp.cog.sanger.ac.uk/public/celltype/keras/keras_606D0E926847C0A1_weights.tsv.gz'
            keras_model_cluster_labels = "${projectDir}/assets/keras_cluster/data-cluster_labels.csv"
            filter_top_cell_probabilities = '0.5,0.75'
            save_all_probabilities        = '--save_all_probabilities'
            h5_layer = 'log1p_cp10k'
        }
    }

    //--------------------------------------------------------------------------
    // 2.5 CellTypist — REQUIRES celltype_assignment.run_celltypist.value = true
    //--------------------------------------------------------------------------

    celltypist {
        description = """See https://github.com/Teichlab/celltypist

                One CELLTYPIST run is fanned out per model listed in `models`.
                OPTIONS (pre-downloaded models; otherwise download .pkl files from CellTypist to
                use a different or more up-to-date model):
                Adult_Mouse_Gut.pkl         COVID19_Immune_Landscape.pkl  Human_IPF_Lung.pkl    Lethal_COVID19_Lung.pkl
                Autopsy_COVID19_Lung.pkl    Developing_Human_Brain.pkl    Human_Lung_Atlas.pkl  models.json
                Cells_Fetal_Lung.pkl        Developing_Human_Thymus.pkl   Human_PF_Lung.pkl     Nuclei_Lung_Airway.pkl
                Cells_Intestinal_Tract.pkl  Developing_Mouse_Brain.pkl    Immune_All_High.pkl   Pan_Fetal_Human.pkl
                Cells_Lung_Airway.pkl       Healthy_COVID19_PBMC.pkl      Immune_All_Low.pkl"""
        sample_plot_probs = false
        models      = ["Immune_All_High.pkl","Immune_All_Low.pkl","COVID19_Immune_Landscape.pkl"]
    }

    //--------------------------------------------------------------------------
    // 2.6 scPred — REQUIRES celltype_assignment.run_scpred.value = true
    //--------------------------------------------------------------------------

    scpred {
        description = """Parameters for scPred.
            REQUIRES celltype_assignment.run_scpred.value = true."""
        reference   = "https://yascp.cog.sanger.ac.uk/public/celltype/scpred/hier_scpred.RDS"
    }


//==============================================================================
// 3) DECONVOLUTION
//==============================================================================

    do_deconvolution {
        description = """Master switch for the whole deconvolution workflow.
            If false, none of the sub-methods below run."""
        value       = true
    }

    //--------------------------------------------------------------------------
    // 3.1 cellSNP — variant pile-up
    //--------------------------------------------------------------------------

    existing_cellsnp {
        description = """Directory to scan for already-completed cellSNP outputs to reuse
            instead of rerunning.
            The default points at an empty placeholder directory, so nothing is captured
            unless you point this at a real previous run's output."""
        value       = "${projectDir}/assets/existing_cellsnp"
    }

    cellsnp {
        description = """Parameters for cellSNP.

              copy_mode            Publish mode for cellSNP outputs. Also (re)used by the
                                   CAPTURE_CELLBENDER_FILES publishDir in
                                   modules/local/cellbender/functions.nf - shared rather
                                   than duplicated there.
              vcf_candidate_snps   Default candidate-SNP panel, used when you have not
                                   provided your own panel and
                                   use_bam_derived_cellsnp_panel.value = false.
              min_maf              Minimum minor allele frequency.
              min_count            Minimum aggregated count.
              UMItag               Tag for UMI: UR, Auto, None. In Auto mode, UR is used if
                                   barcodes are provided, otherwise None. None means no UMI,
                                   just read counts.
              minMAPQ              Minimum MAPQ for read filtering.
              cellTAG              Barcode tag name; also used directly to extract barcodes
                                   from the BAM via `samtools view | grep`.

            The candidate-SNP list comes from the link at
            https://github.com/single-cell-genetics/cellSNP - i.e.
            https://sourceforge.net/projects/cellsnp/files/SNPlist/genome1K.phase3.SNP_AF5e2.chr1toX.hg38.vcf.gz/download"""
        copy_mode          = "rellink"
        vcf_candidate_snps = "https://yascp.cog.sanger.ac.uk/public/cellsnp/genome1K.phase3.SNP_AF5e2.chr1toX.hg38.vcf.gz"
        min_maf            = " --minMAF 0.1"
        min_count          = "--minCOUNT 20"
        UMItag             = ' --UMItag UB'
        cellTAG            = 'CB'
        minMAPQ            = '--minMAPQ 20'
    }

    //--------------------------------------------------------------------------
    // 3.2 vireo — donor demultiplexing
    //--------------------------------------------------------------------------

    existing_vireo {
        description = """Directory to scan for already-completed vireo outputs to reuse
            (CAPTURE_VIREO) - e.g. useful if vireo was run independently for chimera samples.
            Shares the same empty placeholder default as existing_cellsnp above; point it at a
            real vireo output directory to actually capture anything."""
        value       = "${projectDir}/assets/existing_vireo"
    }

    vireo {
        description = """Parameters for vireo.

              run                   Enables VIREO.
              copy_mode             Publish mode for vireo outputs.
              do_vireo_subsampling  Enables VIREO_SUBSAMPLING (repeated deconvolution on random
                                    SNP subsets) to assess how sensitive the donor calls are to
                                    the exact SNP panel used.
              subsample_times       Number of random-subset repeats to run.
                                    REQUIRES do_vireo_subsampling = true.
              rate                  Number/rate of SNPs sampled per repeat (passed to
                                    random_variants.py).
                                    REQUIRES do_vireo_subsampling = true."""
        run                  = true
        copy_mode            = "rellink"
        do_vireo_subsampling = true
        subsample_times      = 10
        rate                 = 60
    }

    //--------------------------------------------------------------------------
    // 3.3 Genotype input — GT-aware deconvolution, GT matching, concordance
    //--------------------------------------------------------------------------

    genotype_input {
        description = """Parameters controlling how reference genotypes are used.

              run_with_genotype_input        Master switch: whether genotypes are used at all in
                                             this run (vireo-with-GT, GT-matching, concordance).
                                             Most other genotype_input.* fields and several
                                             top-level deconvolution params below are only read
                                             when this is true.
              subset_genotypes               If true, reference genotypes are subset down to the
                                             donor_vcf_ids listed per pool in input_data_table
                                             before matching; if false, the reference cohort's
                                             genotypes are used in full and only n_pooled (donor
                                             count) is used to size the model.
              vireo_with_gt                  If true, VIREO itself runs WITH the expected
                                             genotypes as a prior; if false, VIREO runs
                                             genotype-free even though genotypes are available
                                             for later GT-matching/concordance.
              subset_vireo_genotypes         Whether to feed VIREO a genotype VCF already subset
                                             to the expected donors (true) or the full merged
                                             cohort VCF (false - in which case pre-merged shards
                                             should be supplied, since the pipeline will not
                                             merge huge cohort VCFs efficiently on the fly).
              posterior_assignment           If true, genotype-donor matching is performed as a
                                             posterior step after deconvolution completes,
                                             rather than only informing VIREO up front.
              tsv_donor_panel_vcfs           TSV of label / vcf_file_path pairs describing the
                                             reference genotype panel(s). Can be one file,
                                             multiple cohorts kept separate, or per-chromosome
                                             shards (main.nf -> parseVcfTsv).
              full_vcf_file                  See the IMPORTANT NOTE below - currently has no
                                             working default.
              ZSCORE_THRESH                  Minimum z0 threshold required to call the GT
                                             assignment confident.
              ZSCORE_DIST_THRESH             Minimum difference between z0 and z1 to call the
                                             assignment confident.
              genotype_correlation_threshold Threshold used by VIREO to determine sample
                                             correlation and which samples originate from the
                                             same donor.

            IMPORTANT NOTE on full_vcf_file:
            subworkflows/prepare_inputs.nf additionally reads genotype_input.full_vcf_file when
            run_with_genotype_input = true - a single merged reference VCF path used to build the
            per-pool donor subset/list channel. This parameter has no usable default here and
            must be supplied by the caller (e.g. on the command line or in a study-specific
            config) whenever run_with_genotype_input = true, otherwise the pipeline will fail
            with a MissingPropertyException. Left blank deliberately rather than guessing a path
            - set it to the same merged VCF referenced by tsv_donor_panel_vcfs if in doubt."""
        run_with_genotype_input        = false
        subset_genotypes               = false
        vireo_with_gt                  = false
        subset_vireo_genotypes         = true
        posterior_assignment           = false
        tsv_donor_panel_vcfs           = ""
        full_vcf_file                  = ""
        ZSCORE_THRESH                  = 3
        ZSCORE_DIST_THRESH             = 3
        genotype_correlation_threshold = 0.6
    }

    //--------------------------------------------------------------------------
    // 3.4 Genotype-dependent extras
    //     All of these REQUIRE genotype_input.run_with_genotype_input = true
    //--------------------------------------------------------------------------

    add_snps_to_pile_up_based_on_genotypes_provided {
        description = """Adds informative SNPs (derived from the provided expected genotypes)
            to the cellSNP pile-up panel, to enhance deconvolution / GT-matching power.
            REQUIRES genotype_input.run_with_genotype_input = true."""
        value       = false
    }

    extra_sample_metadata {
        description = """Path to sample-level metadata used to enhance the donor-level vireo
            summary (ENHANCE_VIREO_METADATA_WITH_DONOR) while still keeping the original
            donor IDs.
            REQUIRES genotype_input.run_with_genotype_input = true
            and genotype_input.posterior_assignment = true."""
        value       = ''
    }

    provide_within_pool_donor_specific_sites_for_pilup {
        description = """If true, cellSNP is given a per-pool panel restricted to sites that are
            informative for exactly the donors expected in that pool
            (DYNAMIC_DONOR_EXCLUSIVE_SNP_SELECTION), instead of the generic candidate-SNP panel.
            REQUIRES genotype_input.run_with_genotype_input = true."""
        value       = false
    }

    concordance_calculations {
        description = """Runs concordance calculations between inferred donor genotypes and
            reference genotypes, to flag cells whose assignment may not be robust.
            REQUIRES genotype_input.run_with_genotype_input = true."""
        value       = false
    }

    use_bam_derived_cellsnp_panel {
        description = """Derives the cellSNP variant panel dynamically from read coverage in
            each pool's BAM (MPILEUP) instead of using the static candidate-SNP panel.
            NOTE: your BAMs may or may not use a 'chr' prefix - make sure this matches whatever
            panel is used for GT-matching, or matching will silently fail.
            REQUIRES genotype_input.run_with_genotype_input = true."""
        value       = false
    }

    mpileup_extra_options {
        description = """Extra CLI options passed to the mpileup command.
            REQUIRES use_bam_derived_cellsnp_panel.value = true."""
        value       = ""
    }

    //--------------------------------------------------------------------------
    // 3.5 GT matching outputs and ID handling
    //--------------------------------------------------------------------------

    // The two parameters below are read ONLY by the standalone `GT_MATCH` entry point
    // (main.nf), which matches an already-produced donor VCF against the reference panel
    // in genotype_input.tsv_donor_panel_vcfs. A normal run never reads them - it takes the
    // equivalent values straight off the deconvolution channel (VIREO_GT_FIX_HEADER).

    vcf {
        description = """Query VCF of already-called donor genotypes to match against the
            reference panel - i.e. the per-pool VCF that vireo/freebayes produced in an
            earlier run.
            REQUIRED WHEN running `-entry GT_MATCH`; unused otherwise.
            REQUIRES a tabix index next to it: main.nf appends ".tbi" to this path, so the
            VCF must be bgzipped and indexed as <vcf>.tbi.
            REQUIRES genotype_input.tsv_donor_panel_vcfs to point at the reference panel to
            match against."""
        value       = ''
    }

    file_name {
        description = """Pool/cohort label attached to the genotypes in `vcf` above. Becomes
            the pool_id in the GT-match output tables and in the "<pool>_vs_<panel>" process
            tags, so use the same experiment_id/pool name the VCF was produced under.
            REQUIRED WHEN running `-entry GT_MATCH`; unused otherwise."""
        value       = ''
    }

    genotype_phenotype_mapping_file {
        description = """Genotype - phenotype mapping file. When set, also used (together with
            use_phenotype_ids_for_gt_match below) to deduplicate donors sequenced twice before
            running vireo with genotypes."""
        value       = ''
    }

    use_phenotype_ids_for_gt_match {
        description = """If false, keeps genotype IDs as-is in the GT-match output; if true,
            replaces them with phenotype IDs.
            NOTE: if false and you still want an ID swap, set genotype_phenotype_mapping_file
            (above) to a CSV whose first column is genotype IDs and whose second column is the
            phenotype IDs to substitute in."""
        value       = true
    }

    gt_match_file {
        description = """Path to pre-computed GT-match results, used to exclude specific samples
            (matched to a certain genotype cohort) from the adaptive QC step.
            NOTE: only has an effect if gt_match_based_adaptive_qc_exclusion_pattern
            (section 4) is also set."""
        value       = ""
    }

    just_overlapping_positions_for_study_merge {
        description = """When merging multiple studies/cohorts, whether to restrict to the
            positions that overlap across all of their VCFs when preparing the GT-match table."""
        value       = false
    }

    cohorts_to_drop_from_GT_Relatednes_check {
        description = """Cohort name(s) (from your genotype-definitions TSV) to exclude from
            the GT relatedness check."""
        value       = ''
    }

    reference_assembly_fasta_dir {
        description = """Reference genome FASTA used for freebayes / GT-header-fixing /
            BAM piling.
            If left as the default URL it is fetched via RETRIEVE_RECOURSES(); otherwise it
            must be a local path."""
        value       = "https://yascp.cog.sanger.ac.uk/public/10x_reference_assembly"
    }

    //--------------------------------------------------------------------------
    // 3.6 Post-deconvolution per-donor outputs
    //--------------------------------------------------------------------------

    split_bam {
        description = """Whether to generate a BAM file per donor after deconvolution.
            NOTE: adds significant runtime and IO for large cohorts."""
        value       = false
    }

    bam_pileup_per_donor {
        description = """Whether to pile up variants per assigned donor after deconvolution
            (freebayes-based).
            Mainly useful when a pool contains just a single donor and you need to
            confirm/identify the source sample."""
        value       = false
    }

    split_h5ad_per_donor {
        description = """Splits the merged h5ad into one file per assigned donor."""
        run                                  = true
        input_h5_genome_version               = "GRCh38"
        print_modules_version                 = "True"
        plot_n_cells_per_vireo_donor          = "True"
        write_donor_level_filtered_cells_h5   = "True"
        plotnine_dpi                          = "100"
        anndata_compression_level             = "6"
    }

    plot_donor_ncells {
        description = """Creates a simple bar plot of cells-per-donor."""
        run          = false
        copy_mode    = "rellink"
        plotnine_dpi = "100"
    }

    //--------------------------------------------------------------------------
    // 3.7 Miscellaneous
    //--------------------------------------------------------------------------

    cellsnp_recapture {
        description = """Used in the echo command in the CAPTURE_CELLSNP_FILES process."""
        value       = '1'
    }

    extra_metadata {
        description = """Used in MERGE_SAMPLES_FROM_H5AD."""
        value       = ''
    }


//==============================================================================
// 4) CLUSTERING & INTEGRATION
//==============================================================================

    //--------------------------------------------------------------------------
    // 4.1 Top-level switches and inputs
    //--------------------------------------------------------------------------

    skip_qc {
        description = """If true, skip QC_AND_INTEGRATION entirely (normalisation, integration,
            clustering and UMAP are all skipped).
            NOTE: also implicitly forces DATA_HANDOVER to run (see skip_handover, section 0)."""
        value       = false
    }

    file__cells_filtered {
        description = """Path to a pre-computed cell-metadata / filtering file.
            REQUIRED WHEN skip_preprocessing.value = true and you want the adaptive-QC /
            hard-filter machinery to see prior filtering results instead of starting fresh."""
        value       = ''
    }

    anndata_compression_opts {
        description = """gzip compression level used when writing intermediate/output AnnData
            files (0-9; higher = smaller files, slower I/O)."""
        value       = 9
    }

    normalise_andata {
        description = """Whether to run NORMALISE_AND_PCA at all.
            If false, PCA/clustering run directly off file__anndata_merged (unnormalised), and
            integration methods that depend on normalised data (TotalVI, Seurat) are effectively
            skipped further down."""
        value       = true
    }

    dont_integrate_just_cluster {
        description = """If true, additionally runs a "no integration" clustering branch
            (DONT_INTEGRATE + UMAP + CLUSTERING) alongside whichever of harmony/bbknn are
            enabled, so you can compare integrated vs unintegrated results."""
        value       = false
    }

    //--------------------------------------------------------------------------
    // 4.2 Cell filtering — hard filters and adaptive (outlier) QC
    //--------------------------------------------------------------------------

    cell_hard_filters {
        description = """Whether to compute + flag (and optionally drop) cells failing the hard
            filters defined in sample_qc.cell_filters.all_samples / .experiment below.
            NOTE: if none of the hard/adaptive filter values are set, CELL_HARD_FILTERS is
            skipped even when this is true (subworkflows/qc_and_integration.nf checks the
            actual filter values too)."""
        value       = true
    }

    hard_filters_drop {
        description = """If true, cells failing hard filters are dropped outright; if false,
            they are only flagged (cell_passes_hard_filters column) and left in the data."""
        value       = false
    }

    gt_match_based_adaptive_qc_exclusion_pattern {
        description = """Gate: whether the GT-match results (assignments_all_pools) are wired
            into the adaptive-QC step as gt_outlier_input at all (workflows/yascp.nf).
            NOTE: this is a DIFFERENT parameter from
            sample_qc.gt_match_based_adaptive_qc_exclusion_pattern below. Both are REQUIRED -
            this one must be non-empty (any truthy marker) together with the nested one for
            GT-based spike-in exclusion to actually happen; if this top-level copy is '', the
            nested pattern is configured but never used."""
        value       = ''
    }

    sample_qc {
        description = """Parameters for sample QC prior to merge.
            Filters are applied to all samples."""

        cell_filters {
            description = """Cell filters. Each entry is a separate filter, and cells that
                evaluate to true for any of them are removed.
                Filters under 'all_samples' apply to all samples; filters under a sample id
                apply to that specific sample only.
                
                all_samples         Hard filters applied to all samples.
                experiment          Hard filters for specific samples - these take priority over all_samples.
                filter_outliers     Adaptive filters - MAD, Isolation Forest or another approach. Multiple methods
                                    can be used, and downstream you can evaluate which yields the most sensible
                                    results."""

            all_samples {
                description = """If nothing, use ''. For multiple filters, split with ; or ,"""
                value       = 'pct_counts_gene_group__mito_transcript > 20 or n_genes_by_counts < 500 or log10_ngenes_by_count < 0.8'
            }

            experiment {
                description = """To apply hard filters per specific experiment, provide e.g.
                    experiment_id:'pct_counts_gene_group__mito_transcript > 20';experiment_id2:'n_genes_by_counts < 500'"""
                // value = ''
                value       = "experiment_id:'pct_counts_gene_group__mito_transcript > 20';experiment_id2:'n_genes_by_counts < 500'"
            }

            filter_outliers {
                description = """After applying cell filters based on cutoffs, apply a filter to
                    remove outliers using cell information from metadata_columns.

                    outliers_fraction       Anticipated fraction of outlier cells. If 0.0, then runs sklearn 
                                            methods with 'auto' as the anticipated number of outlier cells.
                    max_samples             The fraction of cells to draw from X to train each estimator.
                                            Only valid if method == IsolationForest.
                    methods_thresholds      The actual per-method configuration passed to OUTLIER_FILTER - one entry per

                        method                          Method for outlier detection. Available methods: localOutlierFactor, IsolationForest, EllipticEnvelope, OneClassSVM, MAD
                        mad_tresholds                   thresholds used for MAD method.If MAD is used 
                                                        then these thresholds will be used for each of them. [-] prefix means 
                                                        filtering on the left side of distribution, whereas [+] means filtering 
                                                        on the right side of distribution.
                        metadata_columns                columns with metadata
                        outlier_filtering_strategy      Strategy to filter outliers. By default the outliers are filterd for all the cells provided together, \
                                                        but it can be configured to run it per celltype

                    Recommended settings:
                        metadata_columns  n_cells
                        outliers_fraction 0.0
                        max_samples         0.1 or 0.99

                    Notes:
                      - Filters are applied across the full dataset (i.e. not per sample)."""

                run_process = true
                outliers_fraction = 0.0
                max_samples       = 0.1

                // 
                // method / metadata-column combination to run.
                methods_thresholds = [
                    [ method : 'MAD', metadata_columns : 'log1p_total_counts,log1p_n_genes_by_counts,pct_counts_gene_group__mito_transcript', mad_tresholds : "-3,-3,3", outlier_filtering_strategy:'all_together'],
                    [ method : 'IsolationForest', metadata_columns : 'log1p_total_counts,log1p_n_genes_by_counts,pct_counts_gene_group__mito_transcript', outlier_filtering_strategy:'all_together'],
                ]
            }
        }

        gt_match_based_adaptive_qc_exclusion_pattern {
            description = """The actual exclusion pattern string passed to OUTLIER_FILTER
                (--patterns_exclude) to spike in genotype IDs that should be adaptive-QC'd
                independently of assigned celltype.
                REQUIRED together with the top-level
                gt_match_based_adaptive_qc_exclusion_pattern above (that one gates whether
                GT-match data is wired in at all; this one is the actual pattern) - setting
                only one of the two has no effect."""
            value       = ''
        }

        // Downsampling - reduce cell numbers to make integration and clustering more
        // scalable for large cohorts.

        downsample_cells_fraction {
            description = """Downsample to this fraction of the number of observations
                (sc.pp.subsample). Use "" for no downsampling.
                Example: 0.8 drops 20% of cells."""
            value       = ''
        }

        downsample_cells_n {
            description = """Downsample to this number of observations (sc.pp.subsample).
                Use "" for no downsampling.
                Example: 200 keeps 200 cells in total."""
            value       = ''
        }

        downsample_feature_counts {
            description = """Downsample the number of feature counts by this fraction.
                Use "" for no downsampling."""
            value       = ''
        }
    }

    //--------------------------------------------------------------------------
    // 4.3 Normalisation and gene filtering
    //--------------------------------------------------------------------------

    normalise {
        description = """Parameters for normalisation.

              mode                               Normalisation mode passed to
                                                 NORMALISE_AND_PCA.
              layer                              AnnData layer to normalise; also passed
                                                 straight to PCA().
              minimum_number_of_cells_for_donor  Minimum number of cells a donor must have to
                                                 be kept at this stage. Should not be set
                                                 below 3.
              gene_filters                       Gene-level QC prior to merge, applied to all
                                                 samples:
                  .genes_exclude                 Genes to exclude from normalisation/clustering
                                                 - file path, regex pattern, or comma-separated
                                                 gene list. '' excludes nothing.
                  .variable_genes_exclude        Highly-variable genes to keep out of the HVG
                                                 set used for integration/clustering. Use the
                                                 literal value 'no_file__genes_exclude_hvg'
                                                 to disable.
                  .genes_at_least_in_nr_cells    Keep only genes expressed in at least this
                                                 many cells.
              genes_score                        Gene panel used for scanpy score_genes-style
                                                 scoring. Use the literal value
                                                 'no_file__genes_score' to disable scoring.
              drop_cell_passes_qc_from_clustering  If true, drops cells that do not pass the
                                                 adaptive QC criteria before clustering."""
        mode                              = "conventional"
        layer                             = "none"
        minimum_number_of_cells_for_donor = 3

        gene_filters {
            description = """Gene filters applied to all samples prior to merge."""
            // genes_exclude = 'IG[HKL][VDJ]|AC233755.*|IGH[GMDEA]|IGKC|IGLC|IGLL|TR[ABGD][CVDJ]'
            // (can be a file, a regex pattern, or a list of comma-separated gene names)
            genes_exclude            = ''
            variable_genes_exclude   = "${projectDir}/assets/genes_remove_hvg_v001.tsv"
            genes_at_least_in_nr_cells = 5
        }

        genes_score                         = "${projectDir}/assets/genes_score_v001.tsv"
        drop_cell_passes_qc_from_clustering = false
    }

    //--------------------------------------------------------------------------
    // 4.4 Dimensionality reduction
    //--------------------------------------------------------------------------

    reduced_dims {
        description = """Parameters for dimensionality reduction (principal component, Seurat
            and Harmony calculations). All pairwise combinations of vars_to_regress and n_dims
            are performed."""

        vars_to_regress {
            description = """Comma separated string of variables to regress. Use "" for no
                regression. Use ; separation to regress multiple values simultaneously in the
                same run."""
            // value = 'pct_counts_gene_group__mito_transcript'
            value       = ''
        }

        n_dims {
            description = """Number of dimensions to use for calculating PCs, Harmony-corrected
                PCs, and clusters. Value should be an int.
                If auto_estimate == true, the 'knee' of a scree plot is automatically estimated
                via the kneedle algorithm and used, and `value` is ignored entirely (n_pcs then
                comes from ESTIMATE_PCA_ELBOW instead).
                add_n_to_estimate is added to the elbow estimate."""
            auto_estimate     = true
            add_n_to_estimate = 5
            value             = 30   // Only used when auto_estimate = false.
        }

        seurat_integration {
            description = """Seurat integration dimensions.

                  k_anchor              Number of anchors to use in FindIntegrationAnchors.
                  dims                  Number of dimensions to use in FindIntegrationAnchors.
                  ndim_sct              Dimensions for SCT integrated data (check the elbow
                                        plot to see if it is correct).
                  ndim_citeBgRemoved    Dimensions for cite_bgRemoved integrated data (check
                                        the elbow plot).
                  ndim_cite_integrated  Dimensions for cite integrated data (check the elbow
                                        plot).

                NOTE: this whole block is REQUIRED WHEN the top-level
                seurat_integration.run_process (section 4.9) = true. Seurat/CITE-seq integration
                (DSB_INTEGRATE / MULTIMODAL_INTEGRATION) is gated by that separate top-level
                block, not by anything in this one."""
            k_anchor             = 4
            dims                 = 10
            ndim_sct             = 10
            ndim_citeBgRemoved   = 10
            ndim_cite_integrated = 10
        }
    }

    //--------------------------------------------------------------------------
    // 4.5 Integration methods
    //--------------------------------------------------------------------------

    harmony {
        description = """Parameters for Harmony.

              run_process   Master switch: runs HARMONY plus a dedicated UMAP/CLUSTERING
                            branch on Harmony-corrected PCs."""
        run_process = true

        variables_and_thetas {
            description = 'Tuples of metadata columns and corresponding thetas.'
            value       = [
                [ variable: 'experiment_id', theta: 1.0 ],
            ]
        }
    }

    bbknn {
        description = """Parameters for BBKNN.

              run_process         Master switch: runs BBKNN plus a dedicated UMAP/CLUSTERING
                                  branch on BBKNN-corrected neighbours.
              estimate_neighbors  If true, uses BBKNN's own neighbour count for the UMAP and
                                  clustering that follow it (ignoring cluster.number_neighbors
                                  .value / umap.n_neighbors.value below); if false, reuses
                                  those generic values instead."""
        run_process        = true
        estimate_neighbors = true

        batch_variable {
            description = 'Variable to use for batch correction.'
            value       = 'experiment_id'
        }
    }

    totalVi {
        description = """Master switch: runs TOTAL_VI_INTEGRATION.
            REQUIRES normalise_andata.value = true - TotalVI is only invoked inside that branch
            of subworkflows/qc_and_integration.nf.
            Can use a GPU if utilise_gpu.value = true."""
        run_process = false
    }

    seurat_integration {
        description = """Master switch for the Seurat/CITE-seq integration branch
            (DSB_INTEGRATE, MULTIMODAL_INTEGRATION, VDJ_INTEGRATION).
            NOTE: this is a very slow process and works only on small datasets.
            REQUIRES normalise_andata.value = true (it is only reached in that branch); when
            true, reduced_dims.seurat_integration.* (section 4.4) configures it."""
        run_process = false
    }

    lisi {
        description = """Parameters for the Local Inverse Simpson's Index (LISI).

              run_process   Master switch: runs LISI over whichever of the harmony / bbknn /
                            no-integration branches actually ran."""
        run_process = false

        variables {
            description = 'Metadata variables to compute LISI over.'
            value       = 'experiment_id'
        }
    }

    //--------------------------------------------------------------------------
    // 4.6 Clustering
    //--------------------------------------------------------------------------

    cluster {
        description = """Parameters for clustering. All pairwise combinations of method and
            resolution are performed."""

        number_neighbors {
            description = """Number of neighbors. If <= 0, uses the number of unique
                experiment_id values."""
            value       = 15
        }

        methods {
            description = 'Clustering method. Valid options: leiden | louvain.'
            value       = 'leiden'
        }

        resolutions {
            description = 'Clustering resolution.'
            value       = [0.1,0.5,1.0,5.0]
        }

        variables_boxplot {
            description = 'Generate boxplots of these variables for each cluster.'
            value       = 'n_cells,total_counts,pct_counts_gene_group__mito_transcript'
        }

        known_markers {
            description = """Files with markers used to generate dotplots. Each marker file
                should be given as a full path and have the columns cell_type and hgnc_symbol;
                p_value_adj is optional.
                Use "" for a single entry in the file_id and file value to indicate no plots."""
            run_process = false
            value       = []
                // [ file_id: 'SmillieCS_31348891', file: '/lustre/scratch119/humgen/projects/sc-eqtl-ibd/data/marker_gene_db-raw_data/database/celltypes/colon/SmillieCS-31348891/database.tsv'],
                // [ file_id: 'ParikhK_30814735',  file: '/lustre/scratch119/humgen/projects/sc-eqtl-ibd/data/marker_gene_db-raw_data/database/celltypes/colon/ParikhK-30814735/database.tsv'],
                // [ file_id: 'JamesKR_32066951',  file: '/lustre/scratch119/humgen/projects/sc-eqtl-ibd/data/marker_gene_db-raw_data/database/celltypes/colon-immune/JamesKR-32066951/database.tsv']
        }
    }

    //--------------------------------------------------------------------------
    // 4.7 UMAP
    //--------------------------------------------------------------------------

    umap {
        description = 'Parameters for UMAP.'

        colors_quantitative {
            description = 'Comma separated string of quantitative variables used to colour points.'
            value       = "^cell_passes_qc-.*:score\$,S_score,G2M_score,n_cells,^Azimuth:.*(score|mapping\\.score.*)\$,^Celltypist:[^:]+:conf_score\$,^doublet:.*(Score|score|scores)\$,total_counts,pct_counts_gene_group__mito_transcript,prob_doublet,pct_counts_gene_group__ribo_rna,Azimuth:predicted.celltype.l2.score,Azimuth:mapping.score,log10_ngenes_by_count"
        }

        colors_categorical {
            description = 'Comma separated string of categorical variables used to colour points.'
            value       = "^cell_passes_qc-[^:]+(?:-[^:]+)*(:[^:]+)?\$,Hastag.*,hastag.*,phase,experiment_id,cell_passes_qc-MAD-3,\"-3\",\"3-per:all_together\",cell_passes_qc,cell_passes_hard_filters,^doublet:.*(DropletType|predicted_multiplet)\$,^Celltypist:[^:]+:predicted_labels\$,^Azimuth:(L\\d+_)?predicted\\.celltype\\.l\\d+\$"
        }

        n_neighbors {
            description = """Number of neighbors for the sc.pp.neighbors call.
                Recommended value between 2-100. If you expect each cell type cluster to be
                shared across all experiments/samples, then setting this to the number of
                experiments/samples is a good place to start.
                NOTE: values separated with a comma are run within the same script call
                (rather than swarm)."""
            value       = [15,50]
        }

        umap_init {
            description = 'How to initialize the low dimensional embedding.'
            value       = 'spectral'
        }

        umap_min_dist {
            description = """The effective minimum distance between embedded points.
                Recommended value between 0-1.
                NOTE: values separated with a comma are run within the same script call
                (rather than swarm)."""
            value       = 0.5
        }

        umap_spread {
            description = """The effective scale of embedded points.
                Recommended value between 0-3.
                NOTE: values separated with a comma are run within the same script call
                (rather than swarm)."""
            value       = 1.0
        }
    }

    run_celltype_assignment {
        description = """Only affects UMAP colouring
            (modules/local/umap/main.nf: `if (run_celltype_assignment.value)`).
            NOTE: do NOT confuse this with celltype_assignment.run_celltype_assignment
            (section 2.2), which gates the entire celltype-assignment subworkflow. These are
            two independently-read parameters that happen to share most of their name."""
        value       = true
    }

    //--------------------------------------------------------------------------
    // 4.8 Cluster markers and resolution validation
    //--------------------------------------------------------------------------

    cluster_marker {
        description = 'Parameters for identifying cluster marker features.'
        methods {
            description = 'Method for marker detection. Valid options: wilcoxon | logreg.'
            value       = 'wilcoxon'
        }
    }

    cluster_validate_resolution {
        description = 'Parameters for cluster resolution validation.'

        sparsity {
            description = """LogisticRegression sparsity, i.e. the inverse of regularization
                strength; must be a positive float. As in support vector machines, smaller
                values specify stronger regularization."""
            value       = 0.0001
        }

        train_size_cells {
            description = """Number of cells to use for training. Set to -1 to use the default
                of 2/3 of total cells.
                NOTE: do not change this parameter unless you know what you are doing."""
            value       = -1
        }
    }

    cluster_markers {
        description = """Whether to run scanpy-based cluster marker analysis
            (bin/scanpy_cluster_markers.py via modules/local/clustering)."""
        value       = false
    }

    cellex_cluster_markers {
        description = """Whether to additionally run CELLEX-based cluster marker analysis
            (bin/cellex_cluster_markers.py via modules/local/clustering)."""
        value       = false
    }

    cluster_validate_resolution_keras {
        description = """Enables the keras-based branch of cluster resolution validation
            (modules/local/clustering)."""
        value       = true
    }

    //--------------------------------------------------------------------------
    // 4.9 SCCAF cluster assessment
    //--------------------------------------------------------------------------

    sccaf {
        description = """Parameters for SCCAF.

              run_assessment     Master switch: runs the SCCAF cluster-quality assessment step.
              run_optimization   Master switch: runs the SCCAF resolution-optimisation step.
              min_accuracy       Accuracy threshold passed into every CLUSTERING call, used to
                                 flag clusters that fail SCCAF self-projection accuracy."""
        run_assessment   = true
        run_optimization = false
        min_accuracy     = 0.92
    }

    //--------------------------------------------------------------------------
    // 4.10 Metadata and QC plots
    //--------------------------------------------------------------------------

    metadata_key_column {
        description = """Column in metadata that matches the experiment_id column in tenx_data.
            REQUIRED to match id_in (section 0.2)."""
        value       = 'experiment_id'
    }

    plots_qc {
        description = """Parameters for basic QC plots after sample merge. All pairwise
            combinations of facet_columns and variable_columns_distribution_plots are
            performed."""

        facet_columns {
            description = 'Column to facet all QC plots by.'
            value       = 'experiment_id'
        }

        variable_columns_distribution_plots {
            description = 'Plot the distributions of these variables (histogram and ecdf).'
            value       = 'total_counts,pct_counts_gene_group__mito_transcript'
        }
    }

    mads_categories {
        description = """Metadata columns that MAD-based outlier stats are reported for in the
            final QC plots (modules/local/plot_stats)."""
        value       = 'pct_counts_gene_group__mito_transcript,pct_counts_gene_group__mito_protein,pct_counts_gene_group__ribo_protein,pct_counts_gene_group__ribo_rna,total_counts,n_genes_by_counts'
    }

}
